<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Harsha G V — Cloud Cyber Enigma</title>
  <desc id="desc">A dark cyber security banner representing cloud security, application security, identity and AI-driven defense.</desc>

  <defs>
    <style>
      .orbit { transform-box: fill-box; transform-origin: center; animation: orbit 18s linear infinite; }
      .signal { stroke-dasharray: 7 11; animation: signal 2.6s linear infinite; }
      .signal.reverse { animation-direction: reverse; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      .pulse.d1 { animation-delay: .7s; }
      .pulse.d2 { animation-delay: 1.4s; }
      .pulse.d3 { animation-delay: 2.1s; }
      .core { animation: core 3s ease-in-out infinite; }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes signal { to { stroke-dashoffset: -36; } }
      @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
      @keyframes core { 0%,100% { opacity:.75 } 50% { opacity:1 } }
      @media (prefers-reduced-motion: reduce) {
        .orbit,.signal,.pulse,.core { animation:none; opacity:1; }
      }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050B12"/>
      <stop offset=".55" stop-color="#07131A"/>
      <stop offset="1" stop-color="#090D1E"/>
    </linearGradient>

    <linearGradient id="accent" x1="735" y1="70" x2="1100" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39FF88"/>
      <stop offset=".48" stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(950 210) rotate(90) scale(190)">
      <stop stop-color="#39FF88" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#00D9FF" stop-opacity=".06"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#8BA3B5" stroke-opacity=".065"/>
    </pattern>

    <filter id="glowFilter" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" stroke="#FFFFFF" stroke-opacity=".09" stroke-width="2"/>
  <circle cx="950" cy="210" r="190" fill="url(#glow)"/>

  <!-- Left: profile -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="70" y="68" fill="#39FF88" font-size="14" font-weight="700" letter-spacing="3.5">
      HARSHA G V / CLOUD &amp; CYBERSECURITY
    </text>

    <text x="70" y="137" fill="#F8FAFC"
          font-family="Inter, ui-sans-serif, system-ui, sans-serif"
          font-size="45" font-weight="750" letter-spacing="-1.5">
      I build secure
    </text>

    <text x="70" y="190" fill="#F8FAFC"
          font-family="Inter, ui-sans-serif, system-ui, sans-serif"
          font-size="45" font-weight="750" letter-spacing="-1.5">
      cloud systems
    </text>

    <text x="70" y="243" fill="url(#accent)"
          font-family="Inter, ui-sans-serif, system-ui, sans-serif"
          font-size="45" font-weight="750" letter-spacing="-1.5">
      that withstand threats.
    </text>

    <text x="70" y="295" fill="#A4B4C4" font-size="13" letter-spacing="2">
      CLOUD SECURITY · DEVSECOPS · APPSEC · AI SECURITY
    </text>

    <text x="70" y="350" fill="#64748B" font-size="12" letter-spacing="1.6">
      AWS / AZURE  //  SECURITY ENGINEERING  //  SYDNEY
    </text>

    <text x="70" y="382" fill="#39FF88" font-size="11" letter-spacing="2.2">
      CLOUD. CYBER. ENIGMA.
    </text>
  </g>

  <!-- Right: cyber security nexus -->
  <g transform="translate(950 210)">
    <circle r="150" stroke="#00D9FF" stroke-opacity=".08"/>
    <circle r="122" stroke="#39FF88" stroke-opacity=".12"/>
    <circle class="orbit" r="105" stroke="#39FF88" stroke-opacity=".42" stroke-dasharray="5 9"/>
    <circle r="72" stroke="url(#accent)" stroke-width="2" stroke-opacity=".72"/>
    <circle class="core" r="43" fill="#07151A" stroke="#39FF88" stroke-width="2"/>
    <circle class="core" r="25" fill="#39FF88" fill-opacity=".12" stroke="#00D9FF" stroke-opacity=".8"/>

    <!-- shield -->
    <path d="M950 178 L973 187 V204 C973 222 961 236 950 241 C939 236 927 222 927 204 V187 Z"
          fill="#061017" stroke="#39FF88" stroke-width="2" transform="translate(-950 -210)"/>
    <path d="M941 208 L948 215 L961 198" stroke="#39FF88" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round" transform="translate(-950 -210)"/>

    <!-- Cloud nodes -->
    <g stroke="url(#accent)" stroke-width="1.5" fill="#07131A">
      <circle class="pulse" cx="-116" cy="-42" r="7"/>
      <circle class="pulse d1" cx="116" cy="-42" r="7"/>
      <circle class="pulse d2" cx="-118" cy="52" r="7"/>
      <circle class="pulse d3" cx="118" cy="52" r="7"/>
    </g>

    <g stroke="#39FF88" stroke-opacity=".45" stroke-width="1.5">
      <path class="signal" d="M-109 -39 L-67 -24"/>
      <path class="signal reverse" d="M109 -39 L67 -24"/>
      <path class="signal" d="M-111 49 L-67 27"/>
      <path class="signal reverse" d="M111 49 L67 27"/>
    </g>

    <!-- perimeter markers -->
    <g fill="#39FF88">
      <circle cx="0" cy="-122" r="2.5"/>
      <circle cx="122" cy="0" r="2.5"/>
      <circle cx="0" cy="122" r="2.5"/>
      <circle cx="-122" cy="0" r="2.5"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
       font-size="9" letter-spacing="1.2">
      <text x="-145" y="-136" fill="#64748B">IDENTITY</text>
      <text x="72" y="-136" fill="#64748B">CLOUD</text>
      <text x="-145" y="142" fill="#64748B">APPSEC</text>
      <text x="72" y="142" fill="#64748B">AI / IR</text>
    </g>
  </g>
</svg>
